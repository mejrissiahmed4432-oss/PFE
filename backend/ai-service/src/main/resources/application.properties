server.port=8085
server.servlet.context-path=/api
spring.application.name=ai-service

# ─── MongoDB ────────────────────────────────────────────────────────────────
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://admin:admin123@localhost:27017/projet_pfe?authSource=admin}
spring.data.mongodb.auto-index-creation=true

# ─── Ollama (port auto-detected from OLLAMA_HOST env, default 11439) ─────────
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11439}
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:deepseek-v3.1:671b-cloud}
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.chat.options.num-predict=512
spring.ai.ollama.embedding.options.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

# ─── Eureka ──────────────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ─── Service URLs (direct — bypasses gateway for internal traffic) ────────────
app.stock-service.url=${STOCK_SERVICE_URL:http://localhost:8081}
app.technician-service.url=${TECHNICIAN_SERVICE_URL:http://localhost:8083}
app.user-service.url=${USER_SERVICE_URL:http://localhost:8080}

# ─── AI Configuration ────────────────────────────────────────────────────────
app.ai.vector-store.top-k=5
app.ai.vector-store.similarity-threshold=0.65
app.ai.reindex.on-startup=true

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.example.aiservice=DEBUG
logging.level.org.springframework.ai=INFO

# ─── Actuator ────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
