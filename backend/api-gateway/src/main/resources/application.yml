server:
  port: 8000

spring:
  application:
    name: api-gateway
  codec:
    max-in-memory-size: 50MB
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowCredentials: true
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            maxAge: 3600
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      default-filters:
        - AuthenticationFilter
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      routes:
        - id: user-microservice
          uri: lb://user-microservice
          predicates:
            - Path=/api/users/**, /api/users, /api/messages/**, /api/tickets/**, /api/tickets, /api/alerts/**, /api/alerts, /api/notifications/**, /api/notifications
        - id: equipment-route
          uri: lb://stock-manager-microservice
          predicates:
            - Path=/api/equipment/**
        - id: supplier-route
          uri: lb://stock-manager-microservice
          predicates:
            - Path=/api/suppliers/**
        - id: shelf-route
          uri: lb://stock-manager-microservice
          predicates:
            - Path=/api/shelves/**
        - id: dashboard-route
          uri: lb://stock-manager-microservice
          predicates:
            - Path=/api/dashboard/**
        - id: categories-route
          uri: lb://stock-manager-microservice
          predicates:
            - Path=/api/equipment-categories/**
        - id: software-route
          uri: lb://stock-manager-microservice
          predicates:
            - Path=/api/software/**, /api/software
        - id: user-ws-route
          uri: lb://user-microservice
          predicates:
            - Path=/ws/**

        - id: procurement-route
          uri: lb://stock-manager-microservice
          predicates:
            - Path=/api/procurement/**, /api/procurement/catalog, /api/procurement/requests, /api/public/**

        - id: application-route
          uri: lb://stock-manager-microservice
          predicates:
            - Path=/api/applications/**, /api/applications

        - id: os-route
          uri: lb://stock-manager-microservice
          predicates:
            - Path=/api/os/**, /api/os

        - id: monitoring-route
          uri: lb://stock-manager-microservice
          predicates:
            - Path=/api/monitoring/**

        - id: technician-route
          uri: lb://technician-microservice
          predicates:
            - Path=/api/part-requests/**, /api/part-requests, /api/capabilities/**, /api/capabilities

        - id: ai-service-route
          uri: lb://ai-service
          predicates:
            - Path=/api/ai/**, /api/ai


        - id: employee-route
          uri: lb://employee-microservice
          predicates:
            - Path=/api/employees/**, /api/employees

        - id: department-route
          uri: lb://employee-microservice
          predicates:
            - Path=/api/departments/**, /api/departments

        - id: it-manager-route
          uri: lb://it-manager-microservice
          predicates:
            - Path=/api/it-manager/**


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    prefer-ip-address: true
