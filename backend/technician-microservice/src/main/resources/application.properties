spring.application.name=technician-microservice
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Frontend URL
app.frontend.url=${APP_FRONTEND_URL:http://localhost:4200}

# Logging
logging.level.org.springframework.security=DEBUG

server.tomcat.max-http-form-post-size=50MB
spring.codec.max-in-memory-size=50MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.main.lazy-initialization=true

# ── Resilience4j / Feign Circuit Breaker ──────────────────────────────────────
spring.cloud.openfeign.circuitbreaker.enabled=true

# StockManagerClient CB — critical, blocks if stock is down
resilience4j.circuitbreaker.instances.stock-manager-microservice.slidingWindowSize=10
resilience4j.circuitbreaker.instances.stock-manager-microservice.failureRateThreshold=50
resilience4j.circuitbreaker.instances.stock-manager-microservice.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.stock-manager-microservice.permittedNumberOfCallsInHalfOpenState=3

# UserClient CB — non-blocking (notifications/alerts)
resilience4j.circuitbreaker.instances.user-microservice.slidingWindowSize=10
resilience4j.circuitbreaker.instances.user-microservice.failureRateThreshold=50
resilience4j.circuitbreaker.instances.user-microservice.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.user-microservice.permittedNumberOfCallsInHalfOpenState=3
