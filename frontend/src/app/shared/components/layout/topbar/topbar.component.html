<header class="bg-white/80 backdrop-blur-md border-b border-gray-200 h-16 flex items-center justify-between px-6 sticky top-0 z-40 shadow-sm">
  
  <!-- Page Title -->
  <div class="flex items-center">
    <h2 class="text-xl font-bold text-gray-800 tracking-tight">{{ pageTitle }}</h2>
  </div>

  <!-- Actions & Profile -->
  <div class="flex items-center gap-4">
    
    <!-- AI Assistant Button -->
    <button (click)="toggleAssistant.emit()" title="AI Insights"
            class="w-10 h-10 rounded-xl flex items-center justify-center text-gray-500 hover:bg-blue-50 hover:text-blue-600 transition-colors bg-gray-50 border border-gray-100">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l1.912 5.813a2 2 0 001.275 1.275L21 12l-5.813 1.912a2 2 0 00-1.275 1.275L12 21l-1.912-5.813a2 2 0 00-1.275-1.275L3 12l5.813-1.912a2 2 0 001.275-1.275L12 3z" />
      </svg>
    </button>

    <!-- Messages -->
    <button (click)="openMessages.emit()" title="Messages" class="relative w-10 h-10 rounded-xl flex items-center justify-center text-gray-500 hover:bg-gray-100 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
      </svg>
      <span *ngIf="unreadMessagesCount > 0" class="absolute top-1.5 right-1.5 flex h-4 w-4 items-center justify-center rounded-full bg-blue-500 text-[10px] font-bold text-white ring-2 ring-white">
        {{ unreadMessagesCount }}
      </span>
    </button>

    <!-- Notifications -->
    <div class="relative">
      <button (click)="toggleNotifications.emit($event)" title="Notifications" class="relative w-10 h-10 rounded-xl flex items-center justify-center text-gray-500 hover:bg-gray-100 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span *ngIf="unreadNotificationsCount > 0" class="absolute top-1.5 right-1.5 flex h-4 w-4 items-center justify-center rounded-full bg-blue-500 text-[10px] font-bold text-white ring-2 ring-white">
          {{ unreadNotificationsCount }}
        </span>
      </button>

      <!-- Dropdown Logic handled in BoardComponent for now, or we can build a proper Tailwind dropdown later -->
    </div>

    <!-- Alerts -->
    <button (click)="openAlerts.emit()" title="Alerts" class="relative w-10 h-10 rounded-xl flex items-center justify-center text-gray-500 hover:bg-gray-100 transition-colors">
       <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
        <line x1="12" y1="9" x2="12" y2="13"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
      <span *ngIf="unreadAlertsCount > 0" class="absolute top-1.5 right-1.5 flex h-4 w-4 items-center justify-center rounded-full bg-red-500 text-[10px] font-bold text-white ring-2 ring-white">
        {{ unreadAlertsCount }}
      </span>
    </button>

    <div class="w-px h-6 bg-gray-200 mx-2"></div>

    <!-- User Profile Dropdown Placeholder (Click to open Profile) -->
    <button (click)="openProfile.emit()" class="flex items-center gap-3 hover:bg-gray-50 p-1.5 rounded-xl transition-colors">
      <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-blue-600 to-blue-400 flex items-center justify-center text-white font-bold text-sm shadow-sm border-2 border-white">
         {{ ((user?.firstName?.charAt(0) || 'M') + (user?.lastName?.charAt(0) || 'C')) | uppercase }}
      </div>
      <div class="hidden md:flex flex-col items-start">
        <span class="text-sm font-bold text-gray-900 leading-tight">{{ user?.firstName || 'User' }} {{ user?.lastName || '' }}</span>
        <span class="text-xs font-medium text-gray-500 capitalize">{{ (user?.role || 'User').replace('_', ' ').toLowerCase() }}</span>
      </div>
    </button>

  </div>
</header>
