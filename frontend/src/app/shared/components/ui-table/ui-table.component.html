<div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden flex flex-col w-full">
  
  <!-- Toolbar (Search & Filters) -->
  <div class="p-4 border-b border-gray-200 flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white" *ngIf="showToolbar">
    
    <!-- Search -->
    <div class="relative max-w-sm w-full" *ngIf="showSearch">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
        </svg>
      </div>
      <input type="text" 
             class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg leading-5 bg-white placeholder-gray-500 focus:outline-none focus:placeholder-gray-400 focus:ring-1 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition-colors" 
             [placeholder]="searchPlaceholder"
             [value]="searchValue"
             (input)="onSearchChange($event)">
    </div>

    <!-- Filters/Actions Slot -->
    <div class="flex items-center gap-2">
      <ng-content select="[filters]"></ng-content>
    </div>
  </div>

  <!-- Table Container -->
  <div class="overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200">
      <ng-content select="[thead]"></ng-content>
      <ng-content select="[tbody]"></ng-content>
    </table>
    
    <!-- Empty State Projection -->
    <ng-content select="[empty-state]"></ng-content>
  </div>

  <!-- Pagination Slot -->
  <div class="bg-white px-4 py-3 border-t border-gray-200 sm:px-6" *ngIf="showPagination">
    <ng-content select="[pagination]"></ng-content>
  </div>
</div>
