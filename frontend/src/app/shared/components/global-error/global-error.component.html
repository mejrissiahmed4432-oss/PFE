<div *ngIf="errorState$ | async as state" >
    <div *ngIf="state.show" 
         @backdropFade
         class="fixed inset-0 z-[9999] flex items-center justify-center bg-gray-900/60 backdrop-blur-sm p-4">
      
      <!-- Modal Box -->
      <div @fadeSlideInOut
           class="relative w-full max-w-md bg-white rounded-2xl shadow-2xl border border-gray-100 overflow-hidden">
        
        <!-- Top decorative border -->
        <div class="h-1.5 w-full bg-gradient-to-r from-red-500 to-rose-400"></div>
  
        <div class="p-6 sm:p-8">
          <!-- Icon & Header -->
          <div class="flex items-start space-x-4">
            <div class="flex-shrink-0 flex items-center justify-center w-12 h-12 rounded-full bg-red-100 border-4 border-red-50">
              <svg class="w-6 h-6 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
              </svg>
            </div>
            
            <div class="pt-1">
              <h3 class="text-xl font-semibold text-gray-900 tracking-tight">Service Unavailable</h3>
              <p class="mt-2 text-sm text-gray-500 leading-relaxed">
                {{ state.message }}
              </p>
            </div>
          </div>
  
          <!-- Actions -->
          <div class="mt-8 flex justify-end space-x-3">
            <button (click)="closeDialog()" 
                    class="px-5 py-2.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-xl hover:bg-gray-50 hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-all duration-200">
              Close
            </button>
            <button (click)="closeDialog()" 
                    class="px-5 py-2.5 text-sm font-medium text-white bg-red-600 rounded-xl hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 shadow-sm shadow-red-200 transition-all duration-200">
              Understood
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
