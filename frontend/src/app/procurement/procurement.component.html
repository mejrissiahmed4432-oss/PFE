<div class="procurement-page">

  <!-- Header -->
  <div class="proc-header">
    <div class="proc-title-group">
      <!-- Brand Logo -->
      <div class="proc-icon-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
          <path d="M3 6h18"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
      </div>
      <div>
        <h1>Procurement</h1>
        <p>Manage equipment requests, approvals &amp; purchase orders</p>
      </div>
    </div>

    <div class="header-right">
      <!-- Tab Navigation -->
      <nav class="proc-tabs">
        <button
          *ngFor="let tab of tabs"
          (click)="activeTab = tab.id"
          class="tab-btn"
          [class.active]="activeTab === tab.id">

          {{ tab.label }}

          <span *ngIf="tab.count && tab.count > 0" class="tab-badge">
            {{ tab.count }}
          </span>
        </button>
      </nav>
    </div>
  </div>

  <!-- Content Area -->
  <div class="proc-content">

    <!-- Dashboard -->
    <app-procurement-dashboard *ngIf="activeTab === 'dashboard'"
                               [userId]="userId"
                               [userRole]="userRole">
    </app-procurement-dashboard>

    <!-- New Request Form -->
    <app-equipment-request-form *ngIf="activeTab === 'new-request'"
                                [userId]="userId"
                                [userName]="userName"
                                [userRole]="userRole"
                                (requestCreated)="activeTab = 'my-requests'">
    </app-equipment-request-form>

    <!-- My Requests List -->
    <app-equipment-request-list *ngIf="activeTab === 'my-requests'"
                                [userId]="userId"
                                [userRole]="userRole"
                                (sendToRFQ)="onSendToRFQ($event)">
    </app-equipment-request-list>

    <!-- Approvals (IT Only) -->
    <app-it-approval-dashboard *ngIf="activeTab === 'approvals'"
                               [userId]="userId"
                               [userRole]="userRole"
                               (pendingCountChanged)="pendingApprovalsCount = $event">
    </app-it-approval-dashboard>

    <!-- RFQ Manager (IT Only) -->
    <app-rfq-manager *ngIf="activeTab === 'rfq'">
    </app-rfq-manager>

    <!-- Supplier Responses (IT Only) -->
    <app-supplier-response-list *ngIf="activeTab === 'responses'"
                                (createOrder)="onCreateOrder($event)">
    </app-supplier-response-list>

    <!-- Purchase Order View -->
    <app-purchase-order-view *ngIf="activeTab === 'orders'">
    </app-purchase-order-view>

  </div>
</div>
