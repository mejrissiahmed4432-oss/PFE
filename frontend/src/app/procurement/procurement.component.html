<div class="flex flex-col h-full bg-slate-50/50">
  <!-- Tab Navigation -->
  <div class="px-6 pt-6 pb-2 border-b border-slate-200/60 backdrop-blur-sm sticky top-0 z-10">
    <nav class="flex flex-wrap gap-2">
      <button
        *ngFor="let tab of tabs"
        class="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-200"
        [ngClass]="activeTab === tab.id ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/20' : 'text-slate-500 hover:bg-white hover:text-slate-800 hover:shadow-sm'"
        (click)="activeTab = tab.id">
        <span class="text-base">{{ tab.icon }}</span>
        <span>{{ tab.label }}</span>
      </button>
    </nav>
  </div>

  <!-- Tab Content -->
  <div id="procurement-scroll-container" class="flex-1 overflow-y-auto p-6 scroll-smooth">
    <div class="max-w-7xl mx-auto animate-fade-in-up">

      <!-- Overview Dashboard -->
      <app-procurement-dashboard *ngIf="activeTab === 'dashboard'">
      </app-procurement-dashboard>

      <!-- New Request (Stock Manager) -->
      <app-equipment-request-form
        *ngIf="activeTab === 'new-request'"
        [userId]="userId"
        [userName]="userName">
      </app-equipment-request-form>

      <!-- My Requests (Stock Manager) -->
      <app-equipment-request-list
        *ngIf="activeTab === 'my-requests'">
      </app-equipment-request-list>

      <!-- Approvals Dashboard (IT Manager) -->
      <app-it-approval-dashboard
        *ngIf="activeTab === 'approvals'"
        (sendToRFQ)="onSendToRFQ($event)">
      </app-it-approval-dashboard>

      <!-- RFQ Manager (IT Manager) -->
      <app-rfq-manager
        *ngIf="activeTab === 'rfq'">
      </app-rfq-manager>

      <!-- Supplier Responses & Comparison (IT Manager) -->
      <app-supplier-response-list
        *ngIf="activeTab === 'responses'"
        (createOrder)="onCreateOrder($event)">
      </app-supplier-response-list>

      <!-- Purchase Orders (IT Manager) -->
      <app-purchase-order-view
        *ngIf="activeTab === 'orders'">
      </app-purchase-order-view>
    </div>
  </div>
</div>
