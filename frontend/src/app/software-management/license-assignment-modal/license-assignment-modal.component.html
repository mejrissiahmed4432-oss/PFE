<div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[9999] flex items-center justify-center p-4" *ngIf="pool">
  <div class="bg-white rounded-2xl w-full max-w-lg shadow-2xl flex flex-col overflow-hidden animate-in zoom-in-95 duration-200">
    
    <div class="bg-slate-50 border-b border-slate-200 p-6">
      <h2 class="text-xl font-bold text-slate-800">Assign License Seat</h2>
      <p class="text-sm text-slate-500 mt-1">Assign a seat from this {{ pool.licenseModel }} pool.</p>
    </div>

    <div class="p-6 space-y-4">
      <div class="flex justify-between p-4 bg-emerald-50 rounded-lg border border-emerald-100 mb-6">
        <span class="text-emerald-800 font-bold">Available Seats</span>
        <span class="text-emerald-700 font-black">{{ pool.availableSeats }} / {{ pool.totalSeats }}</span>
      </div>

      <div>
        <label class="block text-sm font-bold text-slate-700 mb-2">Assign To (Type)</label>
        <select [(ngModel)]="assignment.assignedToType" class="w-full p-3 border border-slate-300 rounded-lg outline-none focus:border-blue-500 bg-white">
          <option *ngFor="let t of assignedToTypes" [value]="t">{{ t }}</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-bold text-slate-700 mb-2">Target Name</label>
        <input type="text" [(ngModel)]="assignment.assignedTargetName" class="w-full p-3 border border-slate-300 rounded-lg outline-none focus:border-blue-500" placeholder="e.g., John Doe or WIN-LAP-001">
        <p class="text-xs text-slate-500 mt-1">Search and select the user or device.</p>
      </div>

      <div *ngIf="pool.activationMethod === 'KEY_BASED'">
        <label class="block text-sm font-bold text-slate-700 mb-2">Specific License Key (Optional)</label>
        <input type="text" [(ngModel)]="assignment.licenseKeyUsed" class="w-full p-3 border border-slate-300 rounded-lg outline-none focus:border-blue-500 font-mono text-sm" placeholder="XXXXX-XXXXX-XXXXX">
      </div>
    </div>

    <div class="bg-slate-50 border-t border-slate-200 p-6 flex justify-end gap-3">
      <button class="px-6 py-2.5 rounded-xl font-bold text-slate-500 hover:bg-slate-200 transition-colors" (click)="cancel()">Cancel</button>
      <button class="px-6 py-2.5 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition-colors shadow-lg shadow-blue-200 flex items-center gap-2" (click)="submit()" [disabled]="!assignment.assignedTargetName || isSubmitting || pool.availableSeats! <= 0">
        <span *ngIf="isSubmitting" class="animate-spin"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg></span>
        {{ isSubmitting ? 'Assigning...' : 'Confirm Assignment' }}
      </button>
    </div>

  </div>
</div>
